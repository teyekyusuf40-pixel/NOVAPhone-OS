<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V26 Pro</title>
    <style>
        :root { --blue: #007aff; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }

        /* SİSTEM EKRANLARI */
        #low-battery-screen, #update-screen, #boot { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; background: #000; }
        .progress-bar { width: 80%; height: 6px; background: #333; border-radius: 3px; margin-top: 20px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--blue); transition: 0.3s; }

        /* ANA ARAYÜZ */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1557683316-973673baf926') center/cover; }
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); color: white; font-size: 14px; }
        
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); padding: 25px; gap: 20px; }
        .app { display: flex; flex-direction: column; align-items: center; color: white; cursor: pointer; }
        .app-icon { width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 5px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .app span { font-size: 12px; font-weight: 500; text-shadow: 1px 1px 3px #000; }

        /* PENCERE SİSTEMİ */
        #win { position: fixed; inset: 0; background: #fff; z-index: 50000; display: none; flex-direction: column; animation: slideUp 0.4s ease; }
        .win-h { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; justify-content: space-between; background: #f8f8f8; }
        .win-b { flex: 1; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- SİSTEM BİLEŞENLERİ -->
    <div id="boot"><h1>NOVA OS</h1><p>Admin Yusuf Edition</p></div>

    <div id="low-battery-screen" style="display:none;">
        <div style="font-size:50px;">🪫</div>
        <h2>Şarj Bitti!</h2>
        <p id="charge-timer">Lütfen 10 dakika bekleyin.</p>
        <button id="c-btn" onclick="startCharging()" style="padding:15px 30px; background:var(--blue); border:none; color:white; border-radius:12px; font-weight:bold;">Şarj Et</button>
    </div>

    <div id="update-screen" style="display:none;">
        <h2 id="up-title">V26 Güncellemesi Yükleniyor</h2>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p id="up-perc">%0</p>
        <p style="font-size:12px; opacity:0.6;">Bu işlem 5 dakika sürebilir.</p>
    </div>

    <!-- ANA İŞLETİM SİSTEMİ -->
    <div id="os">
        <div class="status-bar">
            <span id="clock">00:00</span>
            <span id="bat">🔋 %100</span>
        </div>
        <div class="app-grid" id="grid"></div>
    </div>

    <!-- PENCERE -->
    <div id="win">
        <div class="win-h"><h3 id="win-t" style="margin:0">App</h3><button onclick="closeApp()" style="border:none; background:none; color:var(--blue); font-weight:bold;">Bitti</button></div>
        <div id="win-b" class="win-b"></div>
    </div>

    <script>
        let battery = 100;
        let version = "V17";
        const apps = [
            {n:'Ayarlar', i:'⚙️', c:'#8e8e93', t:'settings'},
            {n:'NurıWEB', i:'🌐', c:'#fff', t:'web', u:'https://duckduckgo.com'},
            {n:'YouTube', i:'🎬', c:'#ff0000', t:'web', u:'https://www.youtube.com/embed/dQw4w9WgXcQ'},
            {n:'Harita', i:'📍', c:'#34c759', t:'web', u:'https://www.google.com/maps/embed'},
            {n:'Hava', i:'☀️', c:'#007aff', t:'web', u:'https://www.mgm.gov.tr'},
            {n:'Galeri', i:'🖼️', c:'#ff2d55', t:'web', u:'https://www.bing.com/images/trending'},
            {n:'Arama', i:'📞', c:'#2ecc71', t:'tel'}
        ];

        // 1. ŞARJ SİSTEMİ
        setInterval(() => {
            if(battery > 0) {
                battery--;
                document.getElementById('bat').innerText = `🔋 %${battery}`;
                if(battery === 0) document.getElementById('low-battery-screen').style.display = 'flex';
            }
        }, 60000); // Gerçek 1 dakika. Test için 1000 yapabilirsin.

        function startCharging() {
            document.getElementById('c-btn').style.display = 'none';
            let mins = 10;
            let interval = setInterval(() => {
                mins--;
                document.getElementById('charge-timer').innerText = `${mins} dakika kaldı...`;
                if(mins <= 0) {
                    clearInterval(interval);
                    battery = 100;
                    document.getElementById('low-battery-screen').style.display = 'none';
                    document.getElementById('c-btn').style.display = 'block';
                    document.getElementById('charge-timer').innerText = "Lütfen 10 dakika bekleyin.";
                }
            }, 1000); // 1 saniye = 1 dakika simülasyonu
        }

        // 2. GÜNCELLEME SİSTEMİ (5 DAKİKA)
        function runUpdate() {
            document.getElementById('win').style.display = 'none';
            document.getElementById('update-screen').style.display = 'flex';
            let p = 0;
            let up = setInterval(() => {
                p++;
                document.getElementById('progress-fill').style.width = p + "%";
                document.getElementById('up-perc').innerText = "%" + p;
                if(p >= 100) {
                    clearInterval(up);
                    version = "V26";
                    document.getElementById('up-title').innerText = "Sistem Güncellendi!";
                    setTimeout(() => { document.getElementById('update-screen').style.display = 'none'; render(); }, 2000);
                }
            }, 3000); // 3 saniye x 100 = 300 saniye (Tam 5 dakika)
        }

        // 3. UYGULAMA MOTORU
        function render() {
            const g = document.getElementById('grid'); g.innerHTML = "";
            apps.forEach(a => {
                g.innerHTML += `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
            });
        }

        function openApp(name) {
            const a = apps.find(x => x.n === name);
            document.getElementById('win-t').innerText = name;
            const b = document.getElementById('win-b');
            document.getElementById('win').style.display = 'flex';
            
            if(a.t === 'settings') {
                b.innerHTML = `<div style="padding:20px;">
                    <h3>Sistem Bilgisi</h3><p>Sürüm: ${version}</p>
                    <p>Donanım: MSI Katana GF66 (32GB RAM)</p>
                    <hr>
                    ${version === 'V17' ? `<button onclick="runUpdate()" style="width:100%; padding:15px; background:var(--blue); color:white; border:none; border-radius:10px;">V26 Güncellemesini Yükle (5 Dakika)</button>` : `<p style="color:green;">✓ Sistem Güncel</p>`}
                </div>`;
            } else if(a.t === 'tel') {
                b.innerHTML = `<div style="padding:40px; text-align:center;"><input type="tel" style="width:100%; font-size:30px; text-align:center; border:none; border-bottom:2px solid #ddd;" placeholder="05..."><button class="app-icon" style="background:#2ecc71; margin:20px auto; border:none; color:white;">📞</button></div>`;
            } else {
                b.innerHTML = `<iframe src="${a.u}"></iframe>`;
            }
        }

        function closeApp() { document.getElementById('win').style.display = 'none'; }

        // BAŞLANGIÇ
        setTimeout(() => { document.getElementById('boot').style.display = 'none'; document.getElementById('os').style.display = 'flex'; render(); }, 2000);
        setInterval(() => { let d = new Date(); document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0'); }, 1000);
    </script>
</body>
</html>
