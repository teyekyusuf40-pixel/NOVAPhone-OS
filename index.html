<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVAPhone OS</title>
    <style>
        :root { --mi-blue: #0c64d4; --blur-bg: rgba(255, 255, 255, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }

        /* 1. BOOT SCREEN (iOS Stil) */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s;
        }
        .ios-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }

        /* 2. SETUP SCREEN (Xiaomi Stil) */
        #setup-container {
            position: fixed; inset: 0; background: #fff; color: #000;
            display: none; flex-direction: column; z-index: 900;
        }
        .step { display: none; flex-direction: column; height: 100%; padding: 40px 20px; box-sizing: border-box; }
        .step.active { display: flex; }
        .header { text-align: center; margin-bottom: 30px; }
        .mi-logo { width: 50px; height: 50px; background: var(--mi-blue); color: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin: 0 auto 15px; }
        .mi-input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; background: #f9f9f9; font-size: 16px; margin-top: 10px; box-sizing: border-box; }
        .next-btn { width: 60px; height: 60px; background: var(--mi-blue); border: none; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; margin: auto auto 30px; }

        /* 3. MAIN SYSTEM (Desktop) */
        #main-system {
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400') center/cover;
            display: none; flex-direction: column; position: relative;
        }
        .status-bar { height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-weight: bold; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
        .app { display: flex; flex-direction: column; align-items: center; }
        .app-icon { width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .app span { font-size: 11px; margin-top: 5px; text-shadow: 1px 1px 2px #000; }

        /* 4. CONTROL CENTER */
        #control-center {
            position: absolute; top: -100%; right: 0; width: 100%; height: 90%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(20px);
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            transition: top 0.4s ease; z-index: 100; padding: 50px 20px; box-sizing: border-box;
        }
        #control-center.active { top: 0; }
        #drag-trigger { position: absolute; top: 0; right: 0; width: 100px; height: 40px; z-index: 200; }
        .control-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .control-tile { background: var(--blur-bg); height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- AÇILIŞ -->
    <div id="boot-screen">
        <h1 style="letter-spacing: 5px;">NOVAPhone</h1>
        <div class="ios-spinner"></div>
    </div>

    <!-- KURULUM -->
    <div id="setup-container">
        <div class="step active" id="step1">
            <div class="header"><div class="mi-logo">N</div><h1>Hoş Geldiniz</h1><p>NOVAPhone OS Kurulumu</p></div>
            <input type="text" id="user-name" class="mi-input" placeholder="Yönetici Adı" value="Admin">
            <button class="next-btn" onclick="nextStep()">→</button>
        </div>
        <div class="step" id="step2">
            <div class="header"><h1>Neredeyse Bitti</h1><p>Şartları kabul edin ve başlayın.</p></div>
            <div style="background:#eee; padding:15px; border-radius:10px; font-size:12px; color:#555;">Bu cihaz Yusuf (Admin) tarafından yapılandırılmıştır.</div>
            <button class="next-btn" onclick="finishSetup()">✓</button>
        </div>
    </div>

    <!-- ANA EKRAN -->
    <div id="main-system">
        <div id="drag-trigger" onclick="toggleControl()"></div>
        <div class="status-bar">
            <span id="os-time">12:00</span>
            <span>📶 🔋 100%</span>
        </div>

        <div id="control-center" onclick="toggleControl()">
            <div class="control-grid">
                <div class="control-tile" style="background:var(--mi-blue)">📶</div>
                <div class="control-tile" style="background:var(--mi-blue)">✈️</div>
                <div class="control-tile">🔦</div>
                <div class="control-tile">🌙</div>
            </div>
            <div style="width:100%; height:40px; background:var(--blur-bg); border-radius:10px; margin-top:30px;">
                <div style="width:70%; height:100%; background:#fff; border-radius:10px;"></div>
            </div>
            <p style="text-align:center; color:#888; margin-top:40px;">Kapatmak için dokun</p>
        </div>

        <div class="app-grid">
            <div class="app"><div class="app-icon" style="background: #2ecc71;">📞</div><span>Telefon</span></div>
            <div class="app"><div class="app-icon" style="background: #3498db;">🌐</div><span>Browser</span></div>
            <div class="app"><div class="app-icon" style="background: #f1c40f;">📁</div><span>Dosyalar</span></div>
            <div class="app"><div class="app-icon" style="background: #e74c3c;">⚙️</div><span>Ayarlar</span></div>
        </div>
    </div>

    <script>
        // Açılıştan Kuruluma Geçiş
        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('setup-container').style.display = 'flex';
            }, 800);
        }, 3000);

        // Adım Geçişleri
        let currentStep = 1;
        function nextStep() {
            document.getElementById('step' + currentStep).classList.remove('active');
            currentStep++;
            document.getElementById('step' + currentStep).classList.add('active');
        }

        // Kurulum Bitir
        function finishSetup() {
            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('main-system').style.display = 'flex';
        }

        // Kontrol Merkezi
        function toggleControl() {
            document.getElementById('control-center').classList.toggle('active');
        }

        // Saat
        function updateTime() {
            const now = new Date();
            document.getElementById('os-time').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000); updateTime();
    </script>
</body>
</html>
