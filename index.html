<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V20 Pro - Pro Gaming</title>
    <style>
        :root { --blue: #007aff; }
        * { box-sizing: border-box; font-family: sans-serif; overflow: hidden; touch-action: none; }
        body { margin: 0; background: #000; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* AÇILIŞ */
        #boot { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { font-size: 35px; letter-spacing: 8px; margin-bottom: 20px; color: var(--blue); }
        .progress-bar { width: 150px; height: 4px; background: #222; border-radius: 10px; }
        .progress-fill { width: 0%; height: 100%; background: var(--blue); transition: 5s linear; }

        /* MASAÜSTÜ */
        #os { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; background: #111; }
        .app-grid { display: flex; flex-direction: column; gap: 25px; align-items: center; justify-content: center; flex: 1; }
        .game-card { width: 100%; max-width: 350px; height: 150px; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .snake-card { background: linear-gradient(45deg, #1db954, #191414); border: 2px solid #1db954; }
        .car-card { background: linear-gradient(45deg, #ff4b2b, #ff416c); border: 2px solid #ff4b2b; }

        /* OYUN EKRANI */
        #game-overlay { position: fixed; inset: 0; background: #000; z-index: 500; display: none; flex-direction: column; }
        canvas { background: #050505; display: block; margin: auto; border-bottom: 2px solid #333; }
        .game-ui { height: 180px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; background: #111; }
        .btn { background: #222; border: 1px solid #444; color: white; border-radius: 20px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
        .btn:active { background: #444; }
        .exit { position: absolute; top: 15px; right: 15px; background: red; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="boot">
        <div class="logo">NOVA OS</div>
        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    </div>

    <div id="os">
        <div style="text-align:center; font-weight:bold; padding: 10px;">NOVA OS V20 PRO - GAMING</div>
        <div class="app-grid">
            <div class="game-card snake-card" onclick="initSnake()">🐍 YILAN V2</div>
            <div class="game-card car-card" onclick="initCar()">🏎️ GERÇEKÇİ YARIŞ</div>
        </div>
    </div>

    <div id="game-overlay">
        <button class="exit" onclick="stopAll()">KAPAT</button>
        <canvas id="c"></canvas>
        <div id="snake-btns" class="game-ui" style="display:none;">
            <div></div><div class="btn" onclick="dir='UP'">▲</div><div></div>
            <div class="btn" onclick="dir='LEFT'">◀</div><div class="btn" onclick="dir='DOWN'">▼</div><div class="btn" onclick="dir='RIGHT'">▶</div>
        </div>
        <div id="car-btns" class="game-ui" style="display:none;">
            <div class="btn" ontouchstart="carM=-8" ontouchend="carM=0" onmousedown="carM=-8" onmouseup="carM=0">◀ SOL</div>
            <div></div>
            <div class="btn" ontouchstart="carM=8" ontouchend="carM=0" onmousedown="carM=8" onmouseup="carM=0">SAĞ ▶</div>
        </div>
    </div>

    <script>
        // BOOT
        setTimeout(() => document.getElementById('fill').style.width = '100%', 100);
        setTimeout(() => { document.getElementById('boot').style.display='none'; document.getElementById('os').style.display='flex'; }, 5000);

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let loop, dir, carM = 0;

        // YILAN OYUNU
        let snk, fd, snkLen;
        function initSnake() {
            document.getElementById('game-overlay').style.display='flex';
            document.getElementById('snake-btns').style.display='grid';
            canvas.width = 300; canvas.height = 300;
            snk = [{x:10, y:10}, {x:9, y:10}];
            fd = {x:15, y:15}; dir = 'RIGHT';
            loop = setInterval(drawSnake, 120);
        }

        function drawSnake() {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,300,300);
            let hX = snk[0].x, hY = snk[0].y;
            if(dir=='UP') hY--; if(dir=='DOWN') hY++; if(dir=='LEFT') hX--; if(dir=='RIGHT') hX++;

            if(hX==fd.x && hY==fd.y) {
                fd = {x:Math.floor(Math.random()*19), y:Math.floor(Math.random()*19)};
            } else { snk.pop(); }

            if(hX<0 || hX>19 || hY<0 || hY>19) return end();
            snk.unshift({x:hX, y:hY});

            ctx.font = "15px Arial";
            ctx.fillText("🍎", fd.x*15, fd.y*15 + 12);
            snk.forEach((p, i) => {
                ctx.fillStyle = i==0 ? "#2ecc71" : "#27ae60";
                ctx.fillRect(p.x*15, p.y*15, 14, 14);
            });
        }

        // ARABA OYUNU
        let pX, obs;
        function initCar() {
            document.getElementById('game-overlay').style.display='flex';
            document.getElementById('car-btns').style.display='grid';
            canvas.width = 300; canvas.height = 400;
            pX = 135; obs = [];
            loop = setInterval(drawCar, 30);
        }

        function drawCar() {
            ctx.fillStyle = '#222'; ctx.fillRect(0,0,300,400);
            ctx.strokeStyle = '#fff'; ctx.setLineDash([20, 20]);
            ctx.beginPath(); ctx.moveTo(150,0); ctx.lineTo(150,400); ctx.stroke(); // Yol çizgisi
            
            pX += carM; 
            if(pX<10) pX=10; if(pX>260) pX=260;
            
            ctx.font = "40px Arial";
            ctx.fillText("🏎️", pX, 380); // Oyuncu Araba

            if(Math.random()<0.04) obs.push({x: Math.random()*250, y: -50});
            obs.forEach((o, i) => {
                o.y += 6;
                ctx.fillText("🚔", o.x, o.y); // Rakip Araba
                if(o.y>400) obs.splice(i, 1);
                if(o.y>340 && o.y<390 && Math.abs(o.x - pX) < 25) end();
            });
        }

        function end() { alert("NOVA OS: OYUN BİTTİ!"); stopAll(); }
        function stopAll() {
            clearInterval(loop);
            document.getElementById('game-overlay').style.display='none';
            document.getElementById('snake-btns').style.display='none';
            document.getElementById('car-btns').style.display='none';
        }
    </script>
</body>
</html>
