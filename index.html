<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V26 - Mega Pro</title>
    <style>
        :root { --blue: #007aff; --bg: #f2f2f7; --glass: rgba(255,255,255,0.2); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; color: white; }

        /* AÇILIŞ */
        #boot { position: fixed; inset: 0; background: #000; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader { width: 50px; height: 50px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ŞARJ BİTTİ (10 DK BEKLEME) */
        #dead-battery { position: fixed; inset: 0; background: #000; z-index: 200000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        /* GÜNCELLEME EKRANI */
        #update-ui { position: fixed; inset: 0; background: #000; z-index: 150000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .p-bar { width: 70%; height: 4px; background: #333; border-radius: 2px; margin-top: 20px; overflow: hidden; }
        #p-fill { width: 0%; height: 100%; background: #fff; }

        /* KİLİT EKRANI */
        #lock { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b') center/cover; z-index: 90000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 0; transition: 0.6s; }

        /* ANA SİSTEM */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1493246507139-91e8bef99c1a') center/cover; }
        .status-bar { height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); font-size: 14px; }
        
        .viewport { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; align-content: start; }
        
        /* APPS */
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.2s; }
        .app-icon:active { transform: scale(0.9); }
        .app span { font-size: 11px; margin-top: 6px; text-shadow: 1px 1px 2px #000; text-align: center; }

        /* DOCK */
        .dock { height: 90px; background: rgba(255,255,255,0.2); backdrop-filter: blur(30px); margin: 15px; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }

        /* PENCERE */
        #win { position: fixed; inset: 0; background: #f2f2f7; color: #000; z-index: 10000; display: none; flex-direction: column; animation: slideUp 0.4s ease; }
        .win-h { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #ddd; justify-content: space-between; background: #fff; }
        .win-b { flex: 1; overflow-y: auto; padding: 20px; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* ARAMA MOTORU SİMÜLASYONU */
        .search-engine { display: flex; flex-direction: column; gap: 10px; }
        .search-bar { width: 100%; padding: 15px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        .search-results { margin-top: 10px; }
        .res-item { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div id="boot"><div class="loader"></div><h2 style="margin-top:20px; letter-spacing:5px;">NOVA OS</h2></div>
    
    <div id="dead-battery">
        <div style="font-size:80px;">🪫</div>
        <h2>Şarj Bitti!</h2>
        <p id="charge-msg">Cihazın açılması için şarj olması gerekiyor.</p>
        <p id="timer-text" style="color:var(--blue); font-weight:bold;"></p>
        <button id="charge-btn" onclick="startCharging()" style="padding:15px 30px; border-radius:15px; border:none; background:var(--blue); color:white; font-weight:bold; cursor:pointer;">Şarj Et (10 Dakika)</button>
    </div>

    <div id="update-ui">
        <h2>V26 Yazılımı Yapılandırılıyor...</h2>
        <div class="p-bar"><div id="p-fill"></div></div>
        <p style="margin-top:10px; opacity:0.5;">Yeni uygulamalar ve oyunlar ekleniyor.</p>
    </div>

    <div id="lock" onmousedown="startY=event.clientY" ontouchstart="startY=event.touches[0].clientY" onmouseup="checkSwipe(event.clientY)" ontouchend="checkSwipe(event.changedTouches[0].clientY)">
        <h1 id="l-time" style="font-size:90px; font-weight:200;">00:00</h1>
        <p>▲ Açmak için yukarı kaydır</p>
    </div>

    <div id="os">
        <div class="status-bar">
            <span id="o-time">00:00</span>
            <span id="bat-val">🔋 %100</span>
        </div>
        <div class="viewport" id="app-grid"></div>
        <div class="dock">
            <div class="app" onclick="openApp('Arama')"><div class="app-icon" style="background:#34c759;">📞</div></div>
            <div class="app" onclick="openApp('NurıWEB')"><div class="app-icon" style="background:#fff;">🌐</div></div>
            <div class="app" onclick="openApp('Ayarlar')"><div class="app-icon" style="background:#8e8e93;">⚙️</div></div>
        </div>
    </div>

    <div id="win">
        <div class="win-h"><h3 id="win-t">App</h3><button onclick="closeApp()" style="color:var(--blue); border:none; background:none; font-weight:bold; font-size:16px;">Bitti</button></div>
        <div id="win-b" class="win-b"></div>
    </div>

    <script>
        let battery = 100; let version = "V17"; let startY = 0;
        
        // UYGULAMA LİSTELERİ
        const appsV17 = [
            {n:'Galeri', i:'🖼️', c:'#ff2d55'}, {n:'Müzik', i:'🎵', c:'#ff9500'}, {n:'Notlar', i:'📝', c:'#ffcc00'},
            {n:'Hesap Mak.', i:'➗', c:'#5856d6'}, {n:'Hava', i:'☀️', c:'#5ac8fa'}, {n:'Harita', i:'📍', c:'#4cd964'},
            {n:'Dosyalar', i:'📂', c:'#007aff'}, {n:'Saat', i:'⏰', c:'#000'}, {n:'Kamera', i:'📷', c:'#8e8e93'}, {n:'Takvim', i:'📅', c:'#ff3b30'}
        ];

        const extraV26 = [
            {n:'Yılan Oyunu', i:'🐍', c:'#2ecc71'}, {n:'XOX', i:'❌', c:'#e74c3c'}, {n:'Haberler', i:'📰', c:'#34495e'},
            {n:'Borsa', i:'📈', c:'#27ae60'}, {n:'Nova Chat', i:'💬', c:'#9b59b6'}, {n:'Mail', i:'📧', c:'#3498db'},
            {n:'Video', i:'🎥', c:'#e67e22'}, {n:'Mağaza', i:'🛍️', c:'#f1c40f'}, {n:'Çizim', i:'🎨', c:'#1abc9c'},
            {n:'Ses Kaydı', i:'🎙️', c:'#7f8c8d'}, {n:'Translate', i:'🔡', c:'#2980b9'}, {n:'Hız Testi', i:'🚀', c:'#c0392b'},
            {n:'Fener', i:'🔦', c:'#d35400'}, {n:'Nova Pay', i:'💳', c:'#2c3e50'}, {n:'Sözlük', i:'📖', c:'#16a085'},
            {n:'Rehber', i:'👤', c:'#7f8c8d'}, {n:'QR Tarayıcı', i:'🔳', c:'#000'}, {n:'Nova Game', i:'🎮', c:'#8e44ad'},
            {n:'E-Kitap', i:'📚', c:'#d35400'}, {n:'Nova TV', i:'📺', c:'#c0392b'}
        ];

        // BOOT
        setTimeout(() => { document.getElementById('boot').style.display='none'; }, 2500);

        // KİLİT AÇMA
        function checkSwipe(endY) {
            if(startY - endY > 100) {
                document.getElementById('lock').style.transform = 'translateY(-100%)';
                setTimeout(() => { document.getElementById('os').style.display='flex'; renderApps(); }, 400);
            }
        }

        // UYGULAMA MOTORU
        function renderApps() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            let currentList = version === "V17" ? appsV17 : [...appsV17, ...extraV26];
            currentList.forEach(a => {
                grid.innerHTML += `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
            });
        }

        function openApp(name) {
            document.getElementById('win-t').innerText = name;
            const b = document.getElementById('win-b');
            document.getElementById('win').style.display = 'flex';
            
            if(name === 'NurıWEB') {
                b.innerHTML = `
                    <div class="search-engine">
                        <input type="text" class="search-bar" id="sq" placeholder="Nova Search'de ara..." onkeyup="if(event.keyCode==13) doSearch()">
                        <div id="results" class="search-results">
                            <div class="res-item"><b>Nova OS V26 Yayında!</b><p>Yeni güncelleme ile 30 uygulama Yusuf'un MSI Katana'sına yüklendi.</p></div>
                            <div class="res-item"><b>Arama Motoru Aktif</b><p>Artık her şeyi buradan aratabilirsin Yusuf.</p></div>
                        </div>
                    </div>`;
            } else if(name === 'Ayarlar') {
                b.innerHTML = `
                    <div style="background:#fff; border-radius:12px; padding:15px;">
                        <h4>Sistem Sürümü: ${version}</h4>
                        <p>Cihaz: MSI Katana Pro</p>
                        <hr>
                        <button onclick="version='V17'; alert('Sıfırlandı'); renderApps(); closeApp();" style="color:red; border:none; background:none; padding:10px;">Şifreyi/Sistemi Sıfırla</button><br>
                        <button onclick="alert('Dil: Türkçe');" style="border:none; background:none; padding:10px;">Dil Değiştir</button>
                        <hr>
                        ${version === 'V17' ? `<button onclick="startUpdate()" style="width:100%; padding:15px; background:var(--blue); color:#fff; border-radius:10px; border:none;">V26'ya Güncelle (20 Sn)</button>` : `<p style="color:green">Sistem Güncel!</p>`}
                    </div>`;
            } else if(name === 'XOX') {
                b.innerHTML = `<h3>XOX Oyunu</h3><div style="display:grid; grid-template-columns:repeat(3,100px); gap:5px;">${Array(9).fill('<div style="height:100px; background:#ddd; display:flex; align-items:center; justify-content:center; font-size:40px;" onclick="this.innerText=\'X\'"></div>').join('')}</div>`;
            } else {
                b.innerHTML = `<div style="text-align:center; padding-top:50px;"><h2>${name}</h2><p>Bu uygulama Nova OS V26 ile optimize edildi.</p><div style="font-size:80px;">✨</div></div>`;
            }
        }

        function doSearch() {
            const q = document.getElementById('sq').value;
            document.getElementById('results').innerHTML = `<div class="res-item"><b>${q} için sonuçlar:</b><p>Nova OS Yusuf için "<b>${q}</b>" konusunu araştırdı ve her şeyin yolunda olduğunu buldu!</p></div>` + document.getElementById('results').innerHTML;
        }

        function closeApp() { document.getElementById('win').style.display = 'none'; }

        // GÜNCELLEME SİSTEMİ
        function startUpdate() {
            closeApp();
            document.getElementById('update-ui').style.display = 'flex';
            let p = 0;
            let int = setInterval(() => {
                p++;
                document.getElementById('p-fill').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(int);
                    version = "V26";
                    setTimeout(() => { document.getElementById('update-ui').style.display = 'none'; renderApps(); alert("V26 Kuruldu! 30 Uygulama Hazır."); }, 1000);
                }
            }, 200); // 20 saniye
        }

        // ŞARJ VE BEKLEME
        setInterval(() => {
            if(battery > 0) {
                battery--;
                document.getElementById('bat-val').innerText = `🔋 %${battery}`;
                if(battery === 0) document.getElementById('dead-battery').style.display = 'flex';
            }
        }, 60000); // 1 dakikada %1

        function startCharging() {
            document.getElementById('charge-btn').style.display = 'none';
            let total = 600; // 10 dakika = 600 saniye
            let timer = setInterval(() => {
                total--;
                let m = Math.floor(total / 60);
                let s = total % 60;
                document.getElementById('timer-text').innerText = `${m}:${s < 10 ? '0'+s : s} kaldı`;
                if(total <= 0) {
                    clearInterval(timer);
                    battery = 100;
                    document.getElementById('dead-battery').style.display = 'none';
                    document.getElementById('charge-btn').style.display = 'block';
                    document.getElementById('timer-text').innerText = "";
                    document.getElementById('bat-val').innerText = `🔋 %100`;
                }
            }, 1000);
        }

        // SAAT
        setInterval(() => {
            let d = new Date();
            let t = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
            document.getElementById('l-time').innerText = t;
            document.getElementById('o-time').innerText = t;
        }, 1000);
    </script>
</body>
</html>
