<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVAPhone OS v15</title>
    <style>
        :root { --blue: #007aff; --app-radius: 16px; --bg: #000; --speed: 0.3s; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; color: white; }

        /* YÜKLEME EKRANI */
        #boot { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .progress-container { width: 200px; height: 3px; background: #333; border-radius: 10px; margin-top: 25px; overflow: hidden; }
        #boot-bar { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }

        /* GÜNCELLEME EKRANI (1 DAKİKA) */
        #update-screen { position: fixed; inset: 0; background: #000; z-index: 11000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* ANA SİSTEM */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe') center/cover; transition: var(--speed); }
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-weight: 600; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        
        .viewport { flex: 1; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; }
        .viewport::-webkit-scrollbar { display: none; }
        .page { min-width: 100vw; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 20px; padding: 30px; box-sizing: border-box; scroll-snap-align: start; }
        
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .app:active { transform: scale(0.85); }
        .app-icon { width: 65px; height: 65px; border-radius: var(--app-radius); display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: border-radius 0.5s ease; }
        .app span { font-size: 12px; margin-top: 8px; font-weight: 500; text-shadow: 1px 1px 4px #000; }

        /* PENCERE SİSTEMİ */
        #win { position: fixed; inset: 0; background: #fff; color: #000; z-index: 8000; display: none; flex-direction: column; animation: slideUp 0.4s cubic-bezier(0, 1, 0.5, 1); }
        .win-header { height: 65px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; justify-content: space-between; background: #fcfcfc; }
        .win-body { flex: 1; overflow: auto; }
        
        iframe { width: 100%; height: 100%; border: none; }
        .setting-item { padding: 18px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-size: 17px; }
        .setting-item:active { background: #f5f5f5; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- BOOT -->
    <div id="boot">
        <h1 style="letter-spacing: 15px;">NOVAPHONE</h1>
        <div class="progress-container"><div id="boot-bar"></div></div>
    </div>

    <!-- UPDATE MODAL -->
    <div id="update-screen">
        <div style="width:50px; height:50px; border:4px solid #333; border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px;"></div>
        <h2 id="up-title">NovaPhone.15 Yükleniyor...</h2>
        <p style="color:#888; padding: 0 40px;">Uygulamalar optimize ediliyor ve yeni arayüz tasarlanıyor. Lütfen cihazı kapatmayın.</p>
        <p id="timer" style="font-weight:bold; font-size:20px; margin-top:10px;">60s</p>
    </div>

    <!-- OS -->
    <div id="os">
        <div class="status-bar">
            <span id="os-time">00:00</span>
            <div style="display:flex; gap:10px;">📶 <span id="os-bat">--</span>% 🔋</div>
        </div>
        <div class="viewport">
            <div class="page" id="p1"></div>
            <div class="page" id="p2"></div>
        </div>
    </div>

    <!-- WINDOW -->
    <div id="win">
        <div class="win-header">
            <h2 id="win-title" style="margin:0; font-size: 18px;">Uygulama</h2>
            <button onclick="closeWin()" style="background:#eee; border:none; padding:8px 18px; border-radius:20px; color:var(--blue); font-weight:bold;">Kapat</button>
        </div>
        <div id="win-body" class="win-body"></div>
    </div>

    <script>
        const appList = [
            {n:'NurıWEB', i:'🌐', c:'#fff'}, {n:'Kamera', i:'📷', c:'#333'}, {n:'Telefon', i:'📞', c:'#2ecc71'}, {n:'Ayarlar', i:'⚙️', c:'#8e8e93'},
            {n:'Mesajlar', i:'💬', c:'#4cd964'}, {n:'Notlar', i:'📝', c:'#ffcc00'}, {n:'YouTube', i:'🎬', c:'#ff0000'}, {n:'Harita', i:'📍', c:'#34c759'},
            {n:'Müzik', i:'🎵', c:'#ff2d55'}, {n:'Hesap', i:'➕', c:'#ff9500'}, {n:'Hava', i:'☁️', c:'#5ac8fa'}, {n:'Galeri', i:'🖼️', c:'#007aff'},
            {n:'Saat', i:'⏰', c:'#000'}, {n:'Borsa', i:'📈', c:'#2ecc71'}, {n:'Dosyalar', i:'📁', c:'#5ac8fa'}, {n:'NovaLab', i:'🚀', c:'#5856d6'}
        ];

        // BOOT LOGIC
        let b = 0;
        const bInt = setInterval(() => {
            b += Math.random() * 8;
            if(b >= 100) {
                clearInterval(bInt);
                document.getElementById('boot').style.display = 'none';
                document.getElementById('os').style.display = 'flex';
                renderApps();
            }
            document.getElementById('boot-bar').style.width = b + "%";
        }, 150);

        function renderApps() {
            const p1 = document.getElementById('p1');
            const p2 = document.getElementById('p2');
            p1.innerHTML = ""; p2.innerHTML = "";
            appList.forEach((a, i) => {
                const html = `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
                if(i < 12) p1.innerHTML += html; else p2.innerHTML += html;
            });
        }

        function openApp(name) {
            const body = document.getElementById('win-body');
            document.getElementById('win-title').innerText = name;
            document.getElementById('win').style.display = 'flex';
            body.innerHTML = "";

            if(name === 'NurıWEB') {
                body.innerHTML = `<div style="padding:12px; background:#f5f5f5; display:flex; gap:10px;">
                    <input id="url" style="flex:1; border:1px solid #ddd; border-radius:10px; padding:12px;" placeholder="Ara...">
                    <button onclick="goWeb()" style="background:var(--blue); color:white; border:none; border-radius:10px; padding:0 15px;">Ara</button>
                </div><iframe id="browser" src="https://www.bing.com"></iframe>`;
            } else if(name === 'Ayarlar') {
                const sets = ['Wi-Fi: Nova_HighSpeed', 'Bluetooth: Açık', 'Ekran: 180Hz Pro', 'RAM: 32GB LPDDR4', 'Geliştirici: Yusuf (Admin)', '<b>Yazılım Güncelleme</b>', 'Pil Sağlığı: %100', 'Gizlilik ve Güvenlik', 'Genel', 'Ekran Parlaklığı', 'Sesler', 'Duvar Kağıdı', 'Cihazı Sıfırla'];
                sets.forEach(s => {
                    body.innerHTML += `<div class="setting-item" onclick="handleSetting('${s}')"><span>${s}</span><span>></span></div>`;
                });
            } else if(name === 'Kamera') {
                body.innerHTML = `<video id="video" autoplay playsinline style="width:100%; height:100%; object-fit:cover; background:#000"></video>`;
                navigator.mediaDevices.getUserMedia({video:true}).then(s => document.getElementById('video').srcObject = s);
            } else if(name === 'Harita') {
                body.innerHTML = `<iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12000!2d29.0!3d41.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1str!2str!4v12345"></iframe>`;
            } else if(name === 'Hesap') {
                body.innerHTML = `<iframe src="https://www.desmos.com/scientific?lang=tr"></iframe>`;
            } else if(name === 'Notlar') {
                body.innerHTML = `<textarea style="width:100%; height:100%; padding:20px; border:none; font-size:18px; outline:none;" placeholder="Admin notları..."></textarea>`;
            } else if(name === 'YouTube') {
                body.innerHTML = `<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>`;
            } else {
                body.innerHTML = `<div style="padding:40px; text-align:center;"><h2>${name}</h2><p>Admin Yusuf tarafından optimize edildi.</p></div>`;
            }
        }

        function goWeb() {
            const q = document.getElementById('url').value;
            document.getElementById('browser').src = "https://www.bing.com/search?q=" + encodeURIComponent(q);
        }

        function handleSetting(s) {
            if(s.includes('Güncelleme')) {
                startUpdate();
            } else if(s.includes('Sıfırla')) {
                if(confirm('Cihaz sıfırlansın mı?')) location.reload();
            } else {
                alert(s.replace(/<[^>]*>?/gm, '') + " ayarı başarıyla güncellendi.");
            }
        }

        function startUpdate() {
            closeWin();
            const up = document.getElementById('update-screen');
            up.style.display = 'flex';
            let time = 60;
            const upInt = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time + "s";
                if(time <= 0) {
                    clearInterval(upInt);
                    applyV15();
                }
            }, 1000);
        }

        function applyV15() {
            document.getElementById('update-screen').style.display = 'none';
            document.documentElement.style.setProperty('--app-radius', '50%'); // İkonlar Yuvarlak
            document.documentElement.style.setProperty('--speed', '0.8s'); // Daha akıcı animasyon
            document.getElementById('os').style.background = "url('https://images.unsplash.com/photo-1635322966219-b75ed372eb3c') center/cover";
            alert("NovaPhone.15 Güncellemesi Başarıyla Tamamlandı! \n- Yeni Yuvarlak İkon Tasarımı \n- Akıcı Sistem Animasyonları \n- Pro Performans Modu Aktif");
            renderApps();
        }

        function closeWin() {
            const v = document.getElementById('video');
            if(v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('win').style.display = 'none';
        }

        // TIME & BATTERY
        setInterval(() => {
            const d = new Date();
            document.getElementById('os-time').innerText = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
            try { navigator.getBattery().then(b => document.getElementById('os-bat').innerText = Math.floor(b.level*100)); } catch(e) {}
        }, 1000);
    </script>
</body>
</html>
