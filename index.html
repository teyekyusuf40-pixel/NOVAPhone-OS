<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Pon OS V16 - Pro Build</title>
    <style>
        :root { --neon: #ff4655; --bg: #0a0a0c; --app-size: 68px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: -apple-system, sans-serif; overflow: hidden; color: white; }

        /* GAMER ARKA PLAN VE AÇILIŞ */
        #boot { position: fixed; inset: 0; background: #000; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #setup { position: fixed; inset: 0; background: #050505; z-index: 19000; display: none; flex-direction: column; padding: 40px; align-items: center; justify-content: center; text-align: center; }
        .setup-card { background: #111; padding: 30px; border-radius: 30px; border: 2px solid var(--neon); width: 85%; box-shadow: 0 0 30px var(--neon); }

        /* ANA SİSTEM YAPISI */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e') center/cover; }
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; background: rgba(0,0,0,0.85); font-weight: bold; font-size: 14px; border-bottom: 1px solid rgba(255,70,85,0.4); }
        
        /* UYGULAMA SAYFALARI */
        .viewport { flex: 1; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .viewport::-webkit-scrollbar { display: none; }
        .page { min-width: 100vw; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 20px; padding: 25px; scroll-snap-align: start; }
        
        /* SABİT ALT DOCK */
        .dock { height: 100px; background: rgba(255,255,255,0.1); backdrop-filter: blur(40px); margin: 15px; border-radius: 35px; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }

        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .app-icon { width: var(--app-size); height: var(--app-size); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .app span { font-size: 11px; margin-top: 8px; font-weight: 600; text-align: center; white-space: nowrap; }

        /* GERÇEK ÇALIŞAN PENCERELER */
        #win { position: fixed; inset: 0; background: #fff; color: #000; z-index: 15000; display: none; flex-direction: column; animation: slideUp 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .win-header { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #ddd; justify-content: space-between; background: #f1f1f1; }
        .win-body { flex: 1; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ÖZEL COMPONENTLER */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; }
        .calc-btn { height: 60px; background: #eee; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="boot">
        <h1 style="letter-spacing:15px; color:var(--neon); text-shadow: 0 0 20px var(--neon);">NOVA PON</h1>
        <div style="width:220px; height:4px; background:#222; margin-top:20px; border-radius:10px; overflow:hidden;">
            <div id="boot-fill" style="width:0; height:100%; background:var(--neon); transition:2.5s linear;"></div>
        </div>
    </div>

    <div id="setup">
        <div class="setup-card">
            <h1 style="color:var(--neon)">V16 GAMER EDITION</h1>
            <p>Admin Yusuf & Nova Team</p>
            <div style="text-align:left; font-size:13px; color:#aaa; padding:15px; background:#000; border-radius:15px; margin:20px 0;">
                • MSI Katana Kernel v2.0<br>
                • 32GB RAM Virtualization<br>
                • 180Hz High-Refresh Logic<br>
                • Real Call & SMS APIs Active
            </div>
            <button onclick="startOS()" style="width:100%; padding:18px; background:var(--neon); border:none; border-radius:15px; color:white; font-weight:bold; cursor:pointer;">KURULUMU TAMAMLA</button>
        </div>
    </div>

    <div id="os">
        <div class="status-bar">
            <span id="clock">00:00</span>
            <div style="display:flex; gap:12px; color:var(--neon)">32GB RAM | 180Hz</div>
        </div>
        
        <div class="viewport">
            <div class="page" id="p1"></div>
            <div class="page" id="p2"></div>
        </div>

        <div class="dock">
            <div class="app" onclick="openApp('Telefon')"><div class="app-icon" style="background:#2ecc71">📞</div></div>
            <div class="app" onclick="openApp('NurıWEB')"><div class="app-icon" style="background:#fff">🌐</div></div>
            <div class="app" onclick="openApp('Mesajlar')"><div class="app-icon" style="background:#007aff">💬</div></div>
        </div>
    </div>

    <div id="win">
        <div class="win-header">
            <h3 id="win-t" style="margin:0">App</h3>
            <button onclick="closeWin()" style="padding:10px 20px; border:none; background:#ff4655; color:white; border-radius:12px; font-weight:bold;">KAPAT</button>
        </div>
        <div id="win-body" class="win-body"></div>
    </div>

    <script>
        let isV16 = false;
        const apps = [
            {n:'YouTube', i:'🎬', c:'#ff0000', src:'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1'},
            {n:'Roblox 3D', i:'🎮', c:'#000', src:'https://www.roblox.com/discover'},
            {n:'Valorant Mobil', i:'🎯', c:'#fa4454', src:'https://voxiom.io/'},
            {n:'Sporift', i:'🎵', c:'#1DB954', src:'music'},
            {n:'Kamera', i:'📷', c:'#333', src:'camera'},
            {n:'Galeri', i:'🖼️', c:'#ff9500', src:'https://www.bing.com/images/trending'},
            {n:'Notlar', i:'📝', c:'#ffcc00', src:'notes'},
            {n:'Hesapla', i:'➕', c:'#ff9500', src:'calc'},
            {n:'Harita', i:'📍', c:'#34c759', src:'https://www.google.com/maps/embed'},
            {n:'Ayarlar', i:'⚙️', c:'#8e8e93', src:'settings'}
        ];

        // BOOT & INIT
        setTimeout(() => {
            document.getElementById('boot-fill').style.width = "100%";
            setTimeout(() => {
                document.getElementById('boot').style.display='none';
                document.getElementById('setup').style.display='flex';
            }, 2600);
        }, 100);

        function startOS() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('os').style.display = 'flex';
            renderApps();
            startAssistant();
        }

        function renderApps() {
            const p1 = document.getElementById('p1'); const p2 = document.getElementById('p2');
            p1.innerHTML = ""; p2.innerHTML = "";
            apps.forEach((a, i) => {
                const html = `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
                (i < 8 ? p1 : p2).innerHTML += html;
            });
        }

        function openApp(name) {
            const a = apps.find(x => x.n === name) || {n:name, src:name.toLowerCase()};
            document.getElementById('win-t').innerText = a.n;
            const body = document.getElementById('win-body');
            document.getElementById('win').style.display = 'flex';
            body.innerHTML = "";

            if(a.src === 'camera') {
                body.innerHTML = `<video id="video" autoplay style="width:100%; height:100%; object-fit:cover"></video>`;
                navigator.mediaDevices.getUserMedia({video:true}).then(s => document.getElementById('video').srcObject = s);
            } else if(a.src === 'notes') {
                body.innerHTML = `<textarea style="width:100%; height:100%; padding:25px; border:none; outline:none; font-size:18px;" placeholder="Admin Yusuf'un notları..."></textarea>`;
            } else if(a.src === 'settings') {
                body.innerHTML = `<div style="padding:20px"><h2>Nova Pon OS V16</h2><hr><p>Cihaz: Admin Yusuf Special</p><p>RAM: 32GB LPDDR4</p><p>Ekran: 180Hz Pro</p><button onclick="alert('Sistem Güncel!')" style="width:100%; padding:15px; background:var(--neon); color:white; border:none; border-radius:10px;">GÜNCELLEME DENETLE</button></div>`;
            } else if(a.n === 'Telefon') {
                body.innerHTML = `<div style="padding:40px; text-align:center;"><input type="text" id="tel-n" style="font-size:30px; width:100%; text-align:center; margin-bottom:20px;" placeholder="05..."><button onclick="window.location.href='tel:'+document.getElementById('tel-n').value" style="width:100%; height:60px; background:#2ecc71; color:white; border:none; border-radius:30px; font-weight:bold;">GERÇEK ARAMA BAŞLAT</button></div>`;
            } else if(a.n === 'NurıWEB') {
                body.innerHTML = `<iframe src="https://www.bing.com"></iframe>`; // Google hatası yerine Bing/DuckDuckGo daha stabil
            } else {
                body.innerHTML = `<iframe src="${a.src}"></iframe>`;
            }
        }

        function closeWin() { 
            const v = document.getElementById('video');
            if(v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('win').style.display = 'none'; 
        }

        function startAssistant() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(window.SpeechRecognition) {
                const r = new SpeechRecognition(); r.lang = 'tr-TR';
                r.onresult = (e) => { if(e.results[0][0].transcript.toLowerCase().includes('hey nova')) alert("Buyur Admin Yusuf, seni dinliyorum!"); };
                r.onend = () => r.start(); r.start();
            }
        }

        setInterval(() => {
            const d = new Date(); document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
        }, 1000);
    </script>
</body>
</html>
