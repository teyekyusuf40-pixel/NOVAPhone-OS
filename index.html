<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVAPhone OS v15 Pro</title>
    <style>
        :root { --blue: #007aff; --app-radius: 16px; --speed: 0.3s; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: -apple-system, sans-serif; overflow: hidden; color: white; }

        /* BOOT */
        #boot { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bar-bg { width: 200px; height: 3px; background: #333; border-radius: 10px; margin-top: 25px; }
        #boot-fill { width: 0%; height: 100%; background: #fff; }

        /* UPDATE SCREEN */
        #up-screen { position: fixed; inset: 0; background: #000; z-index: 11000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .loader { width: 50px; height: 50px; border: 4px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }

        /* OS */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe') center/cover; transition: background var(--speed); }
        .status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(15px); }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 30px; }
        .app { display: flex; flex-direction: column; align-items: center; transition: var(--speed); }
        .app-icon { width: 65px; height: 65px; border-radius: var(--app-radius); display: flex; align-items: center; justify-content: center; font-size: 35px; transition: border-radius 0.6s ease; box-shadow: 0 8px 15px rgba(0,0,0,0.3); }
        .app span { font-size: 11px; margin-top: 8px; font-weight: 500; }

        /* WINDOW */
        #win { position: fixed; inset: 0; background: #fff; color: #000; z-index: 9000; display: none; flex-direction: column; animation: up 0.4s ease-out; }
        .win-h { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; justify-content: space-between; }
        .win-b { flex: 1; overflow: auto; }
        
        .list { padding: 18px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
        iframe { width: 100%; height: 100%; border: none; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="boot">
        <h1 style="letter-spacing:10px">NOVAPHONE</h1>
        <div class="bar-bg"><div id="boot-fill"></div></div>
    </div>

    <div id="up-screen">
        <div class="loader"></div>
        <h2 id="up-msg" style="margin-top:20px">NovaPhone.15 Yükleniyor...</h2>
        <p id="up-timer" style="font-size:24px; font-weight:bold">60s</p>
    </div>

    <div id="os">
        <div class="status">
            <span id="clock">00:00</span>
            <span>📶 32GB RAM 🔋</span>
        </div>
        <div class="grid" id="main-grid"></div>
    </div>

    <div id="win">
        <div class="win-h">
            <h3 id="win-t" style="margin:0">App</h3>
            <button onclick="closeApp()" style="border:none; background:#eee; padding:8px 15px; border-radius:15px; color:var(--blue)">Kapat</button>
        </div>
        <div id="win-b" class="win-b"></div>
    </div>

    <script>
        let isUpdated = false; 
        const apps = [
            {n:'NurıWEB', i:'🌐', c:'#fff'}, {n:'Kamera', i:'📷', c:'#333'}, {n:'Ayarlar', i:'⚙️', c:'#8e8e93'}, 
            {n:'YouTube', i:'🎬', c:'#ff0000'}, {n:'Notlar', i:'📝', c:'#ffcc00'}, {n:'Harita', i:'📍', c:'#34c759'},
            {n:'Hava', i:'☁️', c:'#5ac8fa'}, {n:'Müzik', i:'🎵', c:'#ff2d55'}
        ];

        // BOOT
        let p = 0;
        const i = setInterval(() => {
            p += 5;
            document.getElementById('boot-fill').style.width = p + "%";
            if(p>=100) { clearInterval(i); document.getElementById('boot').style.display='none'; document.getElementById('os').style.display='flex'; render(); }
        }, 100);

        function render() {
            const g = document.getElementById('main-grid');
            g.innerHTML = "";
            apps.forEach(a => {
                g.innerHTML += `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
            });
        }

        function openApp(n) {
            document.getElementById('win-t').innerText = n;
            const b = document.getElementById('win-b');
            document.getElementById('win').style.display = 'flex';
            b.innerHTML = "";

            if(n === 'Ayarlar') {
                const s = isUpdated ? ['Sürüm: NovaPhone.15 (Güncel)', 'RAM: 32GB', 'Ekran: 180Hz', 'Depolama: 1TB'] : ['Yazılım Güncelleme (NovaPhone.15)', 'RAM: 32GB', 'Ekran: 180Hz'];
                s.forEach(opt => {
                    b.innerHTML += `<div class="list" onclick="act('${opt}')"><span>${opt}</span><span>></span></div>`;
                });
            } else if(n === 'NurıWEB') {
                b.innerHTML = `<iframe src="https://www.bing.com"></iframe>`;
            } else if(n === 'Kamera') {
                b.innerHTML = `<video id="v" autoplay style="width:100%; height:100%; object-fit:cover"></video>`;
                navigator.mediaDevices.getUserMedia({video:true}).then(s => document.getElementById('v').srcObject = s);
            } else if(n === 'YouTube') {
                b.innerHTML = `<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>`;
            } else if(n === 'Notlar') {
                b.innerHTML = `<textarea style="width:100%; height:100%; padding:20px; border:none; outline:none; font-size:18px;" placeholder="Notunuzu yazın..."></textarea>`;
            } else {
                b.innerHTML = `<div style="padding:40px; text-align:center;"><h2>${n} Aktif</h2><p>Tüm fonksiyonlar Yusuf için optimize edildi.</p></div>`;
            }
        }

        function act(opt) {
            if(opt.includes('Güncelleme') && !isUpdated) {
                document.getElementById('win').style.display = 'none';
                document.getElementById('up-screen').style.display = 'flex';
                let t = 60;
                const u = setInterval(() => {
                    t--;
                    document.getElementById('up-timer').innerText = t + "s";
                    if(t <= 0) {
                        clearInterval(u);
                        isUpdated = true;
                        document.getElementById('up-screen').style.display = 'none';
                        document.documentElement.style.setProperty('--app-radius', '50%');
                        document.documentElement.style.setProperty('--speed', '0.7s');
                        document.getElementById('os').style.background = "url('https://images.unsplash.com/photo-1635322966219-b75ed372eb3c') center/cover";
                        alert("Güncelleme Tamamlandı! Artık sistem en güncel sürümde.");
                    }
                }, 1000);
            } else if(isUpdated && opt.includes('Güncel')) {
                alert("Zaten en son sürümü kullanıyorsunuz.");
            }
        }

        function closeApp() {
            const v = document.getElementById('v');
            if(v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('win').style.display = 'none';
        }

        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').innerText = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
        }, 1000);
    </script>
</body>
</html>
