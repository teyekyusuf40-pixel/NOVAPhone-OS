<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVAPhone OS - Pro</title>
    <style>
        :root { --mi-blue: #0c64d4; --bright: 1; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: -apple-system, sans-serif; overflow: hidden; color: white; }
        #brightness-overlay { position: fixed; inset: 0; background: black; opacity: calc(1 - var(--bright)); pointer-events: none; z-index: 9999; }

        /* BOOT */
        #boot { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }

        /* MAIN SYSTEM */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400') center/cover; }
        
        /* STATUS BAR */
        .status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-weight: 600; z-index: 1000; background: rgba(0,0,0,0.2); }

        /* SWIPEABLE DESKTOP */
        .viewport { flex: 1; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .viewport::-webkit-scrollbar { display: none; }
        .page { min-width: 100vw; height: 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 15px; padding: 20px; box-sizing: border-box; }

        /* APPS */
        .app { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: white; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .app span { font-size: 11px; margin-top: 6px; font-weight: 500; }

        /* CONTROL CENTER */
        #cc { position: fixed; top: -110%; left: 0; width: 100%; height: 90%; background: rgba(0,0,0,0.7); backdrop-filter: blur(25px); transition: 0.4s cubic-bezier(0.1, 0.8, 0.2, 1); z-index: 2000; padding: 60px 25px; box-sizing: border-box; border-radius: 0 0 40px 40px; }
        #cc.active { top: 0; }
        .slider-box { width: 100%; background: rgba(255,255,255,0.2); height: 40px; border-radius: 12px; margin: 20px 0; position: relative; overflow: hidden; }
        #bright-slider { width: 100%; height: 100%; cursor: pointer; opacity: 0; position: absolute; z-index: 2; }
        .slider-fill { position: absolute; height: 100%; background: #fff; width: 100%; z-index: 1; transition: 0.1s; }

        /* WINDOW SYSTEM */
        #window { position: fixed; inset: 0; background: #fff; z-index: 3000; display: none; flex-direction: column; color: #000; }
        .win-head { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .close-btn { font-size: 24px; font-weight: bold; color: var(--mi-blue); }

        /* NURİWEB & KAMERA */
        iframe { width: 100%; flex: 1; border: none; }
        #cam-view { width: 100%; flex: 1; background: #000; object-fit: cover; transform: scaleX(-1); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="brightness-overlay"></div>

    <!-- BOOT -->
    <div id="boot">
        <h1 style="letter-spacing: 8px;">NOVAPhone</h1>
        <div class="spinner"></div>
    </div>

    <!-- OS -->
    <div id="os">
        <div class="status" onclick="toggleCC()">
            <span id="time">00:00</span>
            <div style="display:flex; gap:8px;">📶 <span id="bat">--</span>% 🔋</div>
        </div>

        <div class="viewport">
            <!-- Sayfa 1 -->
            <div class="page">
                <div class="app" onclick="openApp('NurıWEB')"><div class="app-icon" style="background:#fff">🌐</div><span>NurıWEB</span></div>
                <div class="app" onclick="openApp('Kamera')"><div class="app-icon" style="background:#333">📷</div><span>Kamera</span></div>
                <div class="app" onclick="openApp('Hesaplama')"><div class="app-icon" style="background:#f39c12">➕</div><span>Hesaplama</span></div>
                <div class="app" onclick="openApp('Notlar')"><div class="app-icon" style="background:#f1c40f">📝</div><span>Notlar</span></div>
                <div class="app" onclick="openApp('Hava Durumu')"><div class="app-icon" style="background:#3498db">☁️</div><span>Hava</span></div>
                <div class="app" onclick="openApp('YouTube')"><div class="app-icon" style="background:#c0392b">🎬</div><span>YouTube</span></div>
                <div class="app" onclick="openApp('Dosyalar')"><div class="app-icon" style="background:#95a5a6">📁</div><span>Dosyalar</span></div>
                <div class="app" onclick="openApp('Ayarlar')"><div class="app-icon" style="background:#7f8c8d">⚙️</div><span>Ayarlar</span></div>
            </div>
            <!-- Sayfa 2 -->
            <div class="page">
                <div class="app" onclick="openApp('Müzik')"><div class="app-icon" style="background:#e74c3c">🎵</div><span>Müzik</span></div>
                <div class="app" onclick="openApp('Galeri')"><div class="app-icon" style="background:#e67e22">🖼️</div><span>Galeri</span></div>
                <div class="app" onclick="openApp('Mesajlar')"><div class="app-icon" style="background:#2ecc71">💬</div><span>Mesajlar</span></div>
            </div>
        </div>

        <!-- CONTROL CENTER -->
        <div id="cc">
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px;">
                <div class="app-icon" style="background:var(--mi-blue); width:50px; height:50px;">📶</div>
                <div class="app-icon" style="background:var(--mi-blue); width:50px; height:50px;">✈️</div>
                <div class="app-icon" style="background:rgba(255,255,255,0.2); width:50px; height:50px;">🔦</div>
                <div class="app-icon" style="background:rgba(255,255,255,0.2); width:50px; height:50px;">🌙</div>
            </div>
            <p style="margin-top:30px; margin-bottom:5px;">Parlaklık</p>
            <div class="slider-box">
                <div class="slider-fill" id="b-fill"></div>
                <input type="range" id="bright-slider" min="0.1" max="1" step="0.01" value="1">
            </div>
            <button onclick="toggleCC()" style="width:100%; padding:15px; border-radius:12px; border:none; margin-top:20px;">Kapat</button>
        </div>
    </div>

    <!-- WINDOW -->
    <div id="window">
        <div class="win-head">
            <h3 id="win-title">Uygulama</h3>
            <div class="close-btn" onclick="closeWin()">Kapat</div>
        </div>
        <div id="win-body" style="flex:1; display:flex; flex-direction:column; overflow:auto;"></div>
    </div>

    <script>
        // BOOT LOGIC
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('boot').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot').style.display = 'none';
                    document.getElementById('os').style.display = 'flex';
                }, 800);
            }, 2500);
        };

        // PARLAKLIK
        const bSlider = document.getElementById('bright-slider');
        bSlider.oninput = (e) => {
            const val = e.target.value;
            document.documentElement.style.setProperty('--bright', val);
            document.getElementById('b-fill').style.width = (val * 100) + "%";
        };

        // SAAT & PİL
        function update() {
            const d = new Date();
            document.getElementById('time').innerText = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
            try { navigator.getBattery().then(b => document.getElementById('bat').innerText = Math.floor(b.level * 100)); } catch(e) {}
        }
        setInterval(update, 1000); update();

        function toggleCC() { document.getElementById('cc').classList.toggle('active'); }

        // UYGULAMA MOTORU
        function openApp(name) {
            const win = document.getElementById('window');
            const body = document.getElementById('win-body');
            document.getElementById('win-title').innerText = name;
            body.innerHTML = "";
            win.style.display = "flex";

            if (name === "NurıWEB") {
                body.innerHTML = `
                    <div style="padding:10px; display:flex; gap:5px; background:#f1f1f1;">
                        <input type="text" id="web-url" placeholder="Google'da ara..." style="flex:1; padding:8px; border-radius:5px; border:1px solid #ccc;">
                        <button onclick="webSearch()" style="padding:8px; background:var(--mi-blue); color:white; border:none; border-radius:5px;">Git</button>
                    </div>
                    <iframe id="web-frame" src="https://www.google.com/search?igu=1"></iframe>`;
            } 
            else if (name === "Kamera") {
                body.innerHTML = `<video id="cam-view" autoplay playsinline></video>`;
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(s => { document.getElementById('cam-view').srcObject = s; })
                    .catch(() => { body.innerHTML = "<p style='padding:20px;'>Kamera izni reddedildi veya cihazda kamera yok.</p>"; });
            }
            else if (name === "Hesaplama") {
                body.innerHTML = `<iframe src="https://www.desmos.com/scientific?lang=tr" style="height:100%"></iframe>`;
            }
            else {
                body.innerHTML = `<div style="padding:20px;"><h3>${name}</h3><p>Bu uygulama Admin (Yusuf) tarafından geliştirilme aşamasındadır.</p></div>`;
            }
        }

        function webSearch() {
            const q = document.getElementById('web-url').value;
            document.getElementById('web-frame').src = `https://www.google.com/search?q=${encodeURIComponent(q)}&igu=1`;
        }

        function closeWin() {
            const v = document.getElementById('cam-view');
            if(v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('window').style.display = "none";
        }
    </script>
</body>
</html>
