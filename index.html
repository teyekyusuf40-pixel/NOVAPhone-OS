<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVAPhone OS</title>
    <style>
        :root { --mi-blue: #0c64d4; --blur-bg: rgba(255, 255, 255, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* ANA EKRAN */
        #main-system {
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400') center/cover;
            display: none; flex-direction: column; position: relative;
        }

        /* ÜST DURUM ÇUBUĞU */
        .status-bar {
            height: 35px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; color: white; font-size: 14px; font-weight: 500; z-index: 10;
        }

        /* UYGULAMALAR */
        .app-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
            padding: 30px 20px;
        }
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon {
            width: 60px; height: 60px; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .app span { color: white; font-size: 11px; text-shadow: 1px 1px 2px #000; }

        /* KONTROL MERKEZİ (SAĞ ÜSTTEN KAYAN) */
        #control-center {
            position: absolute; top: -100%; right: 0; width: 100%; height: 90%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(25px);
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            z-index: 100; padding: 50px 20px 20px; box-sizing: border-box;
        }
        #control-center.active { top: 0; }

        .control-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .control-tile { 
            background: var(--blur-bg); height: 80px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 20px; color: white;
        }
        .control-tile.on { background: var(--mi-blue); }

        .brightness-slider { width: 100%; height: 40px; background: var(--blur-bg); border-radius: 10px; margin-top: 30px; position: relative; overflow: hidden; }
        .brightness-level { width: 70%; height: 100%; background: #fff; }

        /* KAPATMA ÇİZGİSİ */
        .close-handle { width: 40px; height: 5px; background: #666; border-radius: 5px; margin: 20px auto; }

        /* DOCK (ALT PANEL) */
        .dock {
            margin-top: auto; margin-bottom: 15px; align-self: center;
            width: 92%; height: 85px; background: var(--blur-bg);
            backdrop-filter: blur(15px); border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
        }

        /* GÖRÜNMEZ TETİKLEYİCİ (SAĞ ÜST) */
        #drag-trigger {
            position: absolute; top: 0; right: 0; width: 100px; height: 40px;
            z-index: 200; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Kurulum ve Boot ekranları burada (Önceki kodlarınla aynı, sadece finishSetup'ı güncelleyeceğiz) -->
    <!-- ... (Boot ve Setup kodlarını buraya eklediğini varsayıyorum) ... -->

    <div id="main-system">
        <!-- Sağ Üstten Kaydırma Alanı -->
        <div id="drag-trigger" onclick="toggleControl()"></div>

        <div class="status-bar">
            <span id="os-time">19:23</span>
            <span>📶 🔋 98%</span>
        </div>

        <div id="control-center">
            <div class="control-grid">
                <div class="control-tile on">✈️</div>
                <div class="control-tile on">📶</div>
                <div class="control-tile">📡</div>
                <div class="control-tile">🔦</div>
                <div class="control-tile">🌙</div>
                <div class="control-tile">🔄</div>
                <div class="control-tile">📍</div>
                <div class="control-tile">⚙️</div>
            </div>
            <div class="brightness-slider"><div class="brightness-level"></div></div>
            <div class="close-handle" onclick="toggleControl()"></div>
        </div>

        <div class="app-grid">
            <div class="app"><div class="app-icon" style="background: #2ecc71;">📞</div><span>Telefon</span></div>
            <div class="app"><div class="app-icon" style="background: #e67e22;">✉️</div><span>Mesajlar</span></div>
            <div class="app"><div class="app-icon" style="background: #3498db;">🌐</div><span>Tarayıcı</span></div>
            <div class="app"><div class="app-icon" style="background: #9b59b6;">📷</div><span>Kamera</span></div>
            <div class="app"><div class="app-icon" style="background: #f1c40f;">📁</div><span>Dosyalar</span></div>
            <div class="app"><div class="app-icon" style="background: #e74c3c;">🎮</div><span>Oyunlar</span></div>
        </div>

        <div class="dock">
            <div class="app"><div class="app-icon" style="background: #fff; color: #000;">🎵</div></div>
            <div class="app"><div class="app-icon" style="background: #fff; color: #000;">💬</div></div>
            <div class="app"><div class="app-icon" style="background: #fff; color: #000;">🍎</div></div>
            <div class="app"><div class="app-icon" style="background: #fff; color: #000;">🔍</div></div>
        </div>
    </div>

    <script>
        // Saat Güncelleme
        function updateTime() {
            const now = new Date();
            document.getElementById('os-time').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Kontrol Merkezi Aç/Kapat
        function toggleControl() {
            const cc = document.getElementById('control-center');
            cc.classList.toggle('active');
        }

        // Önceki finishSetup fonksiyonunu bununla güncelle
        function finishSetup() {
            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('main-system').style.display = 'flex';
        }
    </script>
</body>
</html>
