<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V26 - Pro</title>
    <style>
        :root { --blue: #007aff; --glass: rgba(255, 255, 255, 0.2); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; color: white; }

        /* 1. ATMOSFERİK AÇILIŞ (DÖNEN YUVARLAK) */
        #boot { position: fixed; inset: 0; background: #000; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 80px; height: 80px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 2. KURULUM EKRANI */
        #setup { position: fixed; inset: 0; background: #fff; color: #000; z-index: 95000; display: none; flex-direction: column; padding: 40px; align-items: center; justify-content: center; }
        .setup-card { width: 100%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 15px; background: #f2f2f7; border: 1px solid #ddd; border-radius: 12px; margin: 10px 0; font-size: 16px; }
        .btn { width: 100%; padding: 18px; background: var(--blue); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }

        /* 3. KİLİT EKRANI */
        #lock { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1557683316-973673baf926') center/cover; z-index: 90000; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 100px 0; transition: 0.6s; }
        #lock-clock { font-size: 80px; font-weight: 200; }

        /* 4. GÜNCELLEME EKRANI (20 SN - GİZLİ SAYAÇ) */
        #update-ui { position: fixed; inset: 0; background: #000; z-index: 110000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .p-bar { width: 70%; height: 4px; background: #333; border-radius: 2px; margin-top: 20px; }
        #p-fill { width: 0%; height: 100%; background: #fff; transition: linear; }

        /* 5. ANA SİSTEM VE KONTROL MERKEZİ */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba') center/cover; }
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.2); backdrop-filter: blur(15px); z-index: 1000; }
        #cc { position: fixed; top: -100%; inset: 0 auto 0 0; width: 100%; height: 350px; background: rgba(0,0,0,0.8); backdrop-filter: blur(30px); z-index: 2000; transition: 0.4s; padding: 60px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* APPS */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); padding: 25px; gap: 20px; }
        .app { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .app-icon { width: 65px; height: 65px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .app span { font-size: 12px; margin-top: 8px; text-shadow: 1px 1px 3px #000; }

        /* PENCERE SİSTEMİ */
        #win { position: fixed; inset: 0; background: #fff; color: #000; z-index: 5000; display: none; flex-direction: column; }
        .win-h { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; justify-content: space-between; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- AÇILIŞ -->
    <div id="boot"><div class="spinner"></div><h2 style="margin-top:20px; letter-spacing:5px;">NOVA OS</h2></div>

    <!-- KURULUM -->
    <div id="setup">
        <div class="setup-card">
            <h1 style="color:var(--blue)">Hoş Geldiniz</h1>
            <input type="text" id="s-user" placeholder="Adınız" value="Admin Yusuf">
            <input type="password" id="s-pass" placeholder="Kilit Şifresi Belirle">
            <select id="s-lang"><option>Türkçe</option><option>English</option></select>
            <button class="btn" onclick="completeSetup()">Kurulumu Bitir</button>
        </div>
    </div>

    <!-- GÜNCELLEME -->
    <div id="update-ui">
        <h2>Sistem Güncelleniyor...</h2>
        <div class="p-bar"><div id="p-fill"></div></div>
        <p id="up-text" style="margin-top:10px; opacity:0.6">Lütfen bekleyin</p>
    </div>

    <!-- KİLİT EKRANI -->
    <div id="lock" onmousedown="startY=event.clientY" ontouchstart="startY=event.touches[0].clientY">
        <h1 id="lock-time">00:00</h1>
        <div id="pass-box" style="display:none; width:80%; max-width:300px;">
            <input type="password" id="check-pass" placeholder="Şifre" style="text-align:center; background:rgba(255,255,255,0.2); border:none; color:white;">
            <button class="btn" onclick="attemptUnlock()" style="margin-top:10px;">Giriş</button>
        </div>
        <p id="hint">▲ Açmak için yukarı kaydır</p>
    </div>

    <!-- KONTROL MERKEZİ -->
    <div id="cc" onclick="toggleCC()">
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:15px;">
            <div style="background:var(--glass); height:70px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px;">✈️</div>
            <div style="background:var(--blue); height:70px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px;">📶</div>
            <div style="background:var(--glass); height:70px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px;">🌙</div>
            <div style="background:var(--glass); height:70px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:24px;" onclick="location.reload()">🔄</div>
        </div>
    </div>

    <!-- ANA EKRAN -->
    <div id="os">
        <div class="status-bar" onclick="toggleCC()">
            <span id="os-time">00:00</span>
            <span id="bat-stat">🔋 %100</span>
        </div>
        <div class="grid" id="app-grid"></div>
    </div>

    <!-- PENCERE -->
    <div id="win">
        <div class="win-h"><h3 id="win-t" style="margin:0">App</h3><button onclick="closeApp()" style="border:none; background:none; color:var(--blue); font-weight:bold;">Kapat</button></div>
        <div id="win-b" style="flex:1; overflow:hidden;"></div>
    </div>

    <script>
        let version = "V17"; let user = "Admin"; let password = ""; let bat = 100;
        const apps = [
            {n:'Ayarlar', i:'⚙️', c:'#8e8e93'},
            {n:'NurıWEB', i:'🌐', c:'#fff', u:'https://www.bing.com'},
            {n:'YouTube', i:'🎬', c:'#f00', u:'https://www.youtube.com/embed/dQw4w9WgXcQ'},
            {n:'Harita', i:'📍', c:'#34c759', u:'https://www.google.com/maps/embed'},
            {n:'Hava', i:'☀️', c:'#007aff', u:'https://www.mgm.gov.tr'},
            {n:'Arama', i:'📞', c:'#2ecc71'}
        ];

        // SÜREÇLER
        setTimeout(() => { document.getElementById('boot').style.display='none'; document.getElementById('setup').style.display='flex'; }, 3000);

        function completeSetup() {
            user = document.getElementById('s-user').value;
            password = document.getElementById('s-pass').value;
            document.getElementById('setup').style.display='none';
            document.getElementById('lock').style.display='flex';
            renderApps();
        }

        // KİLİT
        let startY = 0;
        window.onmouseup = (e) => {
            if(startY - e.clientY > 100) {
                if(password !== "") { document.getElementById('pass-box').style.display='block'; document.getElementById('hint').style.display='none'; }
                else { unlockOS(); }
            }
        };
        function attemptUnlock() {
            if(document.getElementById('check-pass').value === password) unlockOS();
            else alert("Şifre Yanlış!");
        }
        function unlockOS() { document.getElementById('lock').style.transform='translateY(-100%)'; document.getElementById('os').style.display='flex'; }

        // GÜNCELLEME (20 SN)
        function startUpdate() {
            closeApp(); document.getElementById('update-ui').style.display='flex';
            let p = 0;
            let interval = setInterval(() => {
                p++;
                document.getElementById('p-fill').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(interval);
                    version = "V26";
                    setTimeout(() => { document.getElementById('update-ui').style.display='none'; alert("Güncelleme Tamamlandı!"); }, 1000);
                }
            }, 200); // 200ms * 100 = 20 saniye
        }

        // UYGULAMA MOTORU
        function renderApps() {
            const g = document.getElementById('app-grid'); g.innerHTML = "";
            apps.forEach(a => {
                g.innerHTML += `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
            });
        }

        function openApp(name) {
            const a = apps.find(x => x.n === name);
            document.getElementById('win-t').innerText = name;
            const b = document.getElementById('win-b');
            document.getElementById('win').style.display = 'flex';
            if(name === 'Ayarlar') {
                b.innerHTML = `<div style="padding:20px"><h3>Profil: ${user}</h3><p>Sürüm: ${version}</p><hr>
                <div style="background:#f2f2f7; padding:15px; border-radius:10px; margin-bottom:10px;">Şifre Koruması: ${password ? "Aktif" : "Pasif"}</div>
                ${version === 'V17' ? `<button class="btn" onclick="startUpdate()">V26 Güncellemesini Başlat (20 Sn)</button>` : `<p style="color:green">✓ Yazılım Güncel</p>`}
                <button onclick="location.reload()" style="width:100%; margin-top:20px; background:none; border:none; color:red; cursor:pointer">Cihazı Sıfırla</button>
                </div>`;
            } else if(a.u) { b.innerHTML = `<iframe src="${a.u}"></iframe>`; }
        }

        function toggleCC() { const c = document.getElementById('cc'); c.style.top = c.style.top === '0px' ? '-100%' : '0px'; }
        function closeApp() { document.getElementById('win').style.display = 'none'; }

        // SAAT & PİL
        setInterval(() => {
            let d = new Date(); let t = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
            document.getElementById('lock-time').innerText = t; document.getElementById('os-time').innerText = t;
            if(bat > 0) { bat--; document.getElementById('bat-stat').innerText = `🔋 %${bat}`; }
        }, 1000);
    </script>
</body>
</html>
