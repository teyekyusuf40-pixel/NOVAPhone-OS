<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V26 Pro</title>
    <style>
        :root { --blue: #007aff; --glass: rgba(255, 255, 255, 0.2); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; cursor: default; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; color: white; user-select: none; }

        /* BOOT ANIMATION */
        #boot { position: fixed; inset: 0; background: #000; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* KURULUM */
        #setup { position: fixed; inset: 0; background: #fff; color: #000; z-index: 95000; display: none; flex-direction: column; padding: 40px; align-items: center; justify-content: center; }
        input, select { width: 100%; padding: 15px; background: #f2f2f7; border: 1px solid #ddd; border-radius: 12px; margin: 10px 0; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 18px; background: var(--blue); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }

        /* KİLİT EKRANI (DÜZELTİLDİ) */
        #lock { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1557683316-973673baf926') center/cover; z-index: 90000; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 100px 0; transition: transform 0.5s cubic-bezier(0.1, 0.7, 0.1, 1); }
        #lock-clock { font-size: 90px; font-weight: 200; text-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* GÜNCELLEME */
        #update-ui { position: fixed; inset: 0; background: #000; z-index: 110000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .p-bar { width: 75%; height: 5px; background: #222; border-radius: 10px; margin-top: 30px; overflow: hidden; }
        #p-fill { width: 0%; height: 100%; background: #fff; }

        /* SİSTEM */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba') center/cover; }
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; background: rgba(0,0,0,0.2); backdrop-filter: blur(20px); z-index: 1000; cursor: pointer; }
        #cc { position: fixed; top: -110%; left: 0; width: 100%; height: 350px; background: rgba(0,0,0,0.85); backdrop-filter: blur(30px); z-index: 2000; transition: 0.4s ease; padding: 60px 25px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); padding: 25px; gap: 20px; }
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon { width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .app span { font-size: 11px; margin-top: 8px; color: white; text-shadow: 1px 1px 4px #000; }

        /* PENCERE */
        #win { position: fixed; inset: 0; background: #fff; color: #000; z-index: 5000; display: none; flex-direction: column; animation: slideUp 0.4s ease; }
        .win-h { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; justify-content: space-between; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="boot"><div class="spinner"></div><h2 style="margin-top:25px; letter-spacing:6px;">NOVA OS</h2></div>

    <div id="setup">
        <div style="width:100%; max-width:350px; text-align:center;">
            <h1 style="color:var(--blue); font-size:32px;">Nova OS V17</h1>
            <input type="text" id="s-user" placeholder="Adınız" value="Admin Yusuf">
            <input type="password" id="s-pass" placeholder="Kilit Şifresi (Opsiyonel)">
            <select id="s-lang"><option>Türkçe</option><option>English</option></select>
            <button class="btn" onclick="completeSetup()">Kurulumu Tamamla</button>
        </div>
    </div>

    <div id="update-ui">
        <h2>V26 Yazılımı Yükleniyor</h2>
        <div class="p-bar"><div id="p-fill"></div></div>
        <p style="margin-top:15px; opacity:0.5; font-size:13px;">Lütfen cihazı kapatmayın...</p>
    </div>

    <div id="lock" onmousedown="handleStart(event)" ontouchstart="handleStart(event)" onmousemove="handleMove(event)" ontouchmove="handleMove(event)" onmouseup="handleEnd()" ontouchend="handleEnd()">
        <h1 id="lock-time">00:00</h1>
        <div id="pass-box" style="display:none; width:80%; max-width:280px; text-align:center;">
            <input type="password" id="check-pass" placeholder="Şifre Girin" style="background:rgba(255,255,255,0.2); border:none; color:white; text-align:center;">
            <button class="btn" onclick="attemptUnlock()" style="margin-top:15px; padding:12px;">Giriş Yap</button>
        </div>
        <p id="hint" style="animation: bounce 2s infinite;">▲ Yukarı Kaydırarak Aç</p>
    </div>

    <div id="cc">
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:15px;">
            <div class="app-icon" style="background:var(--blue);">📶</div>
            <div class="app-icon" style="background:var(--glass);">✈️</div>
            <div class="app-icon" style="background:var(--glass);">🔦</div>
            <div class="app-icon" style="background:var(--glass);" onclick="location.reload()">🔄</div>
        </div>
    </div>

    <div id="os">
        <div class="status-bar" onclick="toggleCC()">
            <span id="os-time">00:00</span>
            <span id="bat">🔋 %100</span>
        </div>
        <div class="grid" id="app-grid"></div>
    </div>

    <div id="win">
        <div class="win-h"><h3 id="win-t" style="margin:0">Uygulama</h3><button onclick="closeApp()" style="color:var(--blue); border:none; background:none; font-weight:bold; font-size:16px;">Bitti</button></div>
        <div id="win-b" style="flex:1; overflow:hidden;"></div>
    </div>

    <script>
        let version = "V17"; let user = ""; let password = ""; let battery = 100;
        let startY = 0; let currentY = 0; let isDragging = false;

        const apps = [
            {n:'Ayarlar', i:'⚙️', c:'#8e8e93'},
            {n:'NurıWEB', i:'🌐', c:'#fff', u:'https://duckduckgo.com'},
            {n:'YouTube', i:'🎬', c:'#ff0000', u:'https://www.youtube.com/embed/dQw4w9WgXcQ'},
            {n:'Harita', i:'📍', c:'#34c759', u:'https://www.google.com/maps/embed'},
            {n:'Hava', i:'☀️', c:'#007aff', u:'https://www.mgm.gov.tr'},
            {n:'Arama', i:'📞', c:'#2ecc71'}
        ];

        // BOOT & SETUP
        setTimeout(() => { document.getElementById('boot').style.display='none'; document.getElementById('setup').style.display='flex'; }, 2500);

        function completeSetup() {
            user = document.getElementById('s-user').value;
            password = document.getElementById('s-pass').value;
            document.getElementById('setup').style.display='none';
            document.getElementById('lock').style.display='flex';
            renderApps();
        }

        // KİLİT EKRANI KAYDIRMA (FIXED)
        function handleStart(e) {
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            isDragging = true;
        }
        function handleMove(e) {
            if(!isDragging) return;
            currentY = e.touches ? e.touches[0].clientY : e.clientY;
            let diff = startY - currentY;
            if(diff > 0) {
                document.getElementById('lock').style.transform = `translateY(-${diff}px)`;
            }
        }
        function handleEnd() {
            isDragging = false;
            let diff = startY - currentY;
            if(diff > 150) {
                if(password !== "") {
                    document.getElementById('lock').style.transform = `translateY(-100%)`;
                    setTimeout(() => {
                        document.getElementById('lock').style.transform = `translateY(0)`;
                        document.getElementById('pass-box').style.display = 'block';
                        document.getElementById('hint').style.display = 'none';
                        document.getElementById('lock-clock').style.fontSize = '40px';
                    }, 500);
                } else {
                    unlockOS();
                }
            } else {
                document.getElementById('lock').style.transform = `translateY(0)`;
            }
        }

        function attemptUnlock() {
            if(document.getElementById('check-pass').value === password) unlockOS();
            else alert("Şifre Hatalı!");
        }

        function unlockOS() {
            document.getElementById('lock').style.transform = 'translateY(-100%)';
            setTimeout(() => { document.getElementById('os').style.display = 'flex'; }, 400);
        }

        // GÜNCELLEME (20 SN)
        function startUpdate() {
            closeApp();
            document.getElementById('update-ui').style.display = 'flex';
            let p = 0;
            let interval = setInterval(() => {
                p++;
                document.getElementById('p-fill').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(interval);
                    version = "V26";
                    setTimeout(() => {
                        document.getElementById('update-ui').style.display = 'none';
                        alert("Nova OS V26 Aktif!");
                    }, 800);
                }
            }, 200); // 100 * 200ms = 20 saniye
        }

        // APPS
        function renderApps() {
            const g = document.getElementById('app-grid'); g.innerHTML = "";
            apps.forEach(a => g.innerHTML += `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`);
        }

        function openApp(name) {
            const a = apps.find(x => x.n === name);
            document.getElementById('win-t').innerText = name;
            const b = document.getElementById('win-b');
            document.getElementById('win').style.display = 'flex';
            if(name === 'Ayarlar') {
                b.innerHTML = `<div style="padding:25px"><h3>Hoş geldin, ${user}</h3><p>Sistem Sürümü: <b>${version}</b></p><hr>
                <div style="background:#f0f0f5; padding:15px; border-radius:12px; margin-bottom:15px;">Model: MSI Katana Pro V26</div>
                ${version === 'V17' ? `<button class="btn" onclick="startUpdate()">Yazılımı Güncelle (V26)</button>` : `<p style="color:green; font-weight:bold;">✓ Sistem Güncel</p>`}
                <button onclick="location.reload()" style="width:100%; margin-top:20px; background:none; border:none; color:red; font-weight:bold;">Cihazı Sıfırla</button></div>`;
            } else if(a.u) { b.innerHTML = `<iframe src="${a.u}"></iframe>`; }
        }

        function toggleCC() { const c = document.getElementById('cc'); c.style.top = c.style.top === '0px' ? '-110%' : '0px'; }
        function closeApp() { document.getElementById('win').style.display = 'none'; }

        // SAAT & PİL
        setInterval(() => {
            let d = new Date(); let t = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
            document.getElementById('lock-time').innerText = t; document.getElementById('os-time').innerText = t;
            if(battery > 0) { battery--; document.getElementById('bat').innerText = `🔋 %${battery}`; }
        }, 1000);
    </script>
</body>
</html>
