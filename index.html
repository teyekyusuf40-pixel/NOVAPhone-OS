<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V20 Pro - Gaming Edition</title>
    <style>
        :root { --blue: #007aff; --bg: #000; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; overflow: hidden; }
        body { margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* AÇILIŞ EKRANI */
        #boot { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { font-size: 40px; letter-spacing: 10px; font-weight: 200; margin-bottom: 20px; }
        .loader { width: 200px; height: 4px; background: #333; border-radius: 2px; }
        .progress { width: 0%; height: 100%; background: var(--blue); transition: 5s linear; }

        /* ANA EKRAN */
        #os { display: none; width: 100%; height: 100%; flex-direction: column; padding: 20px; background: #1c1c1e; }
        .header { text-align: center; margin-bottom: 30px; color: var(--blue); font-weight: bold; }
        .app-container { display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; flex: 1; }
        .big-app { width: 90%; max-width: 400px; height: 180px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .big-app:active { transform: scale(0.95); }
        .snake-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .car-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }

        /* OYUN PENCERESİ */
        #game-win { position: fixed; inset: 0; background: #000; z-index: 500; display: none; flex-direction: column; }
        canvas { background: #111; display: block; margin: auto; border: 2px solid #333; }
        .controls { height: 150px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .ctrl-btn { background: #333; border: none; color: white; border-radius: 15px; font-size: 20px; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 10px; z-index: 600; }
    </style>
</head>
<body>

    <!-- BOOT -->
    <div id="boot">
        <div class="logo">NOVA OS</div>
        <div style="margin-bottom: 10px; font-size: 14px; color: #888;">Admin Yusuf için hazırlanıyor...</div>
        <div class="loader"><div class="progress" id="prg"></div></div>
    </div>

    <!-- OS -->
    <div id="os">
        <div class="header">NOVA OS V20 PRO</div>
        <div class="app-container">
            <div class="big-app snake-btn" onclick="startSnake()">🐍 YILAN OYUNU</div>
            <div class="big-app car-btn" onclick="startCar()">🏎️ ARABA YARIŞI</div>
        </div>
    </div>

    <!-- GAME WINDOW -->
    <div id="game-win">
        <button class="close-btn" onclick="closeGame()">KAPAT</button>
        <canvas id="gameCanvas"></canvas>
        <div id="snake-ctrl" class="controls" style="display:none;">
            <div></div><button class="ctrl-btn" onclick="changeDir('UP')">▲</button><div></div>
            <button class="ctrl-btn" onclick="changeDir('LEFT')">◀</button>
            <button class="ctrl-btn" onclick="changeDir('DOWN')">▼</button>
            <button class="ctrl-btn" onclick="changeDir('RIGHT')">▶</button>
        </div>
        <div id="car-ctrl" class="controls" style="display:none;">
            <button class="ctrl-btn" style="grid-column: 1" onmousedown="moveCar('LEFT')" onmouseup="stopCar()">◀ SOL</button>
            <div></div>
            <button class="ctrl-btn" style="grid-column: 3" onmousedown="moveCar('RIGHT')" onmouseup="stopCar()">SAĞ ▶</button>
        </div>
    </div>

    <script>
        // BOOT SEQUENCE
        const prg = document.getElementById('prg');
        setTimeout(() => prg.style.width = '100%', 100);
        setTimeout(() => {
            document.getElementById('boot').style.display = 'none';
            document.getElementById('os').style.display = 'flex';
        }, 5100);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameInterval;
        let currentGame = "";

        // SNAKE GAME LOGIC
        let snake, food, direction, score;
        function startSnake() {
            currentGame = "SNAKE";
            document.getElementById('game-win').style.display = 'flex';
            document.getElementById('snake-ctrl').style.display = 'grid';
            canvas.width = 300; canvas.height = 300;
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            direction = 'RIGHT';
            gameInterval = setInterval(drawSnake, 150);
        }

        function drawSnake() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,300,300);
            let headX = snake[0].x; let headY = snake[0].y;
            if(direction == 'UP') headY--; if(direction == 'DOWN') headY++;
            if(direction == 'LEFT') headX--; if(direction == 'RIGHT') headX++;
            
            if(headX == food.x && headY == food.y) {
                food = {x: Math.floor(Math.random()*19), y: Math.floor(Math.random()*19)};
            } else { snake.pop(); }
            
            let newHead = {x: headX, y: headY};
            if(headX<0 || headX>19 || headY<0 || headY>19) return gameOver();
            snake.unshift(newHead);
            
            ctx.fillStyle = "red"; ctx.fillRect(food.x*15, food.y*15, 14, 14);
            ctx.fillStyle = "#2ecc71";
            snake.forEach(p => ctx.fillRect(p.x*15, p.y*15, 14, 14));
        }

        function changeDir(d) { direction = d; }

        // CAR GAME LOGIC
        let carX, obstacles;
        function startCar() {
            currentGame = "CAR";
            document.getElementById('game-win').style.display = 'flex';
            document.getElementById('car-ctrl').style.display = 'grid';
            canvas.width = 300; canvas.height = 400;
            carX = 135; obstacles = [];
            gameInterval = setInterval(drawCar, 30);
        }

        function drawCar() {
            ctx.fillStyle = "#222"; ctx.fillRect(0,0,300,400);
            ctx.fillStyle = "white"; ctx.fillRect(148, 0, 4, 400); // Yol çizgisi
            
            ctx.fillStyle = "#3498db"; ctx.fillRect(carX, 330, 30, 50); // Oyuncu arabası
            
            if(Math.random() < 0.05) obstacles.push({x: Math.random()*270, y: -50});
            ctx.fillStyle = "#e74c3c";
            obstacles.forEach((o, i) => {
                o.y += 5;
                ctx.fillRect(o.x, o.y, 30, 50);
                if(o.y > 400) obstacles.splice(i, 1);
                if(o.y > 300 && o.y < 380 && o.x < carX+30 && o.x+30 > carX) gameOver();
            });
        }

        let carMove = 0;
        function moveCar(d) { carMove = d === 'LEFT' ? -8 : 8; }
        function stopCar() { carMove = 0; }
        setInterval(() => { if(carMove) { carX += carMove; if(carX<0)carX=0; if(carX>270)carX=270; } }, 30);

        function gameOver() { alert("OYUN BİTTİ!"); closeGame(); }
        function closeGame() {
            clearInterval(gameInterval);
            document.getElementById('game-win').style.display = 'none';
            document.getElementById('snake-ctrl').style.display = 'none';
            document.getElementById('car-ctrl').style.display = 'none';
        }
    </script>
</body>
</html>
