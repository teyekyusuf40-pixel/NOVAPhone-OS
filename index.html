<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS V16</title>
    <style>
        :root { --neon: #ff4655; --glass: rgba(255, 255, 255, 0.1); --speed: 0.5s; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }

        /* AÇILIŞ VE KURULUM */
        #boot { position: fixed; inset: 0; background: #000; z-index: 50000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #setup { position: fixed; inset: 0; background: #050505; z-index: 40000; display: none; flex-direction: column; padding: 40px; align-items: center; justify-content: center; }
        .setup-card { background: #111; padding: 35px; border-radius: 30px; border: 2px solid var(--neon); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 40px rgba(255,70,85,0.3); }

        /* KİLİT EKRANI */
        #lock-screen { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400') center/cover; z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 0; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .lock-time { font-size: 80px; font-weight: 200; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .swipe-up { font-size: 18px; animation: bounce 2s infinite; opacity: 0.8; }

        /* ANA SİSTEM */
        #os { display: none; height: 100vh; flex-direction: column; background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e') center/cover; }
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); font-size: 14px; font-weight: 600; z-index: 1000; }
        
        /* DENETİM MERKEZİ (SAĞ ÜST) */
        #control-center { position: fixed; top: -100%; right: 0; width: 100%; height: 350px; background: rgba(0,0,0,0.85); backdrop-filter: blur(30px); z-index: 25000; transition: 0.4s; padding: 60px 25px 25px; border-bottom: 2px solid var(--neon); }
        .cc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .cc-btn { background: var(--glass); height: 70px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .cc-active { background: var(--neon); }

        /* UYGULAMALAR */
        .viewport { flex: 1; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; }
        .page { min-width: 100vw; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 20px; padding: 25px; }
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .app-icon { width: 68px; height: 68px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        .app span { font-size: 11px; margin-top: 8px; font-weight: 600; text-align: center; }

        /* PENCERE SİSTEMİ */
        #win { position: fixed; inset: 0; background: #fff; color: #000; z-index: 20000; display: none; flex-direction: column; animation: slideUp 0.4s ease-out; }
        .win-h { height: 65px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #eee; justify-content: space-between; background: #f8f8f8; }
        .win-b { flex: 1; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        .dock { height: 95px; background: rgba(255,255,255,0.15); backdrop-filter: blur(40px); margin: 15px; border-radius: 35px; display: flex; justify-content: space-around; align-items: center; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1); }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- BOOT & SETUP -->
    <div id="boot">
        <h1 style="letter-spacing:15px; color:var(--neon); text-shadow: 0 0 20px var(--neon);">NOVA OS</h1>
        <div style="width:200px; height:3px; background:#222; margin-top:20px;"><div id="boot-fill" style="width:0; height:100%; background:var(--neon); transition:2s linear;"></div></div>
    </div>

    <div id="setup">
        <div class="setup-card">
            <h2 style="color:var(--neon)">Nova OS V16</h2>
            <p>Admin Yusuf Special Edition</p>
            <div style="text-align:left; font-size:13px; color:#888; background:#000; padding:15px; border-radius:15px; margin:20px 0;">
                • MSI Katana Optimized Engine<br>
                • 32GB RAM Virtual Memory<br>
                • 180Hz Display Driver<br>
                • Secure Kernel V16.0.4
            </div>
            <button onclick="finishSetup()" style="width:100%; padding:18px; background:var(--neon); border:none; border-radius:15px; color:white; font-weight:bold; cursor:pointer;">KURULUMU TAMAMLA</button>
        </div>
    </div>

    <!-- KİLİT EKRANI -->
    <div id="lock-screen" onmousedown="startSwipe(event)" ontouchstart="startSwipe(event)">
        <div class="lock-time" id="lock-time">00:00</div>
        <div style="text-align:center">
            <div class="swipe-up">▲</div>
            <p>Kilidi açmak için yukarı kaydır</p>
        </div>
    </div>

    <!-- DENETİM MERKEZİ -->
    <div id="control-center">
        <div class="cc-grid">
            <div class="cc-btn cc-active">✈️</div>
            <div class="cc-btn cc-active">📶</div>
            <div class="cc-btn cc-active">🎧</div>
            <div class="cc-btn" onclick="toggleFlash()">🔦</div>
            <div class="cc-btn">🌙</div>
            <div class="cc-btn">🔄</div>
            <div class="cc-btn">📍</div>
            <div class="cc-btn" onclick="location.reload()">♻️</div>
        </div>
        <div style="margin-top:30px">
            <input type="range" style="width:100%; accent-color:var(--neon)">
            <input type="range" style="width:100%; margin-top:20px">
        </div>
    </div>

    <!-- ANA EKRAN -->
    <div id="os">
        <div class="status-bar" onmousedown="openCC()">
            <span id="os-clock">00:00</span>
            <div style="display:flex; gap:8px;">32GB RAM | 📶 5G | 🔋 100%</div>
        </div>
        <div class="viewport">
            <div class="page" id="p1"></div>
            <div class="page" id="p2"></div>
        </div>
        <div class="dock">
            <div class="app" onclick="openApp('Telefon')"><div class="app-icon" style="background:#2ecc71">📞</div></div>
            <div class="app" onclick="openApp('NurıWEB')"><div class="app-icon" style="background:#fff">🌐</div></div>
            <div class="app" onclick="openApp('Mesajlar')"><div class="app-icon" style="background:#007aff">💬</div></div>
        </div>
    </div>

    <!-- PENCERE -->
    <div id="win">
        <div class="win-h">
            <h3 id="win-t" style="margin:0">App</h3>
            <button onclick="closeWin()" style="padding:10px 20px; border:none; background:var(--neon); color:white; border-radius:12px; font-weight:bold;">KAPAT</button>
        </div>
        <div id="win-b" class="win-b"></div>
    </div>

    <script>
        let isV17 = false;
        const apps = [
            {n:'YouTube', i:'🎬', c:'#ff0000', u:'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1'},
            {n:'Kamera', i:'📷', c:'#333', u:'camera'},
            {n:'Notlar', i:'📝', c:'#ffcc00', u:'notes'},
            {n:'Harita', i:'📍', c:'#34c759', u:'https://www.google.com/maps/embed'},
            {n:'Sporift', i:'🎵', c:'#1DB954', u:'music'},
            {n:'Galeri', i:'🖼️', c:'#ff9500', u:'https://www.bing.com/images/trending'},
            {n:'Hesapla', i:'➕', c:'#ff9500', u:'calc'},
            {n:'Ayarlar', i:'⚙️', c:'#8e8e93', u:'settings'}
        ];

        // BOOT & SETUP
        setTimeout(() => {
            document.getElementById('boot-fill').style.width = "100%";
            setTimeout(() => {
                document.getElementById('boot').style.display='none';
                document.getElementById('setup').style.display='flex';
            }, 2100);
        }, 100);

        function finishSetup() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('lock-screen').style.display = 'flex';
            renderApps();
        }

        // KİLİT EKRANI SWIPE
        let startY = 0;
        function startSwipe(e) {
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            document.onmousemove = moveSwipe;
            document.ontouchmove = moveSwipe;
            document.onmouseup = endSwipe;
            document.ontouchend = endSwipe;
        }
        function moveSwipe(e) {
            let curY = e.touches ? e.touches[0].clientY : e.clientY;
            let diff = startY - curY;
            if(diff > 50) {
                document.getElementById('lock-screen').style.transform = "translateY(-100%)";
                setTimeout(() => {
                    document.getElementById('os').style.display = 'flex';
                }, 300);
            }
        }
        function endSwipe() { document.onmousemove = null; document.ontouchmove = null; }

        // DENETİM MERKEZİ
        function openCC() {
            const cc = document.getElementById('control-center');
            cc.style.top = cc.style.top === '0px' ? '-100%' : '0px';
        }

        function renderApps() {
            const p1 = document.getElementById('p1'); const p2 = document.getElementById('p2');
            p1.innerHTML = ""; p2.innerHTML = "";
            const currentApps = isV17 ? [...apps, {n:'Console', i:'💻', c:'#000'}, {n:'Files', i:'📂', c:'#5ac8fa'}] : apps;
            currentApps.forEach((a, i) => {
                const html = `<div class="app" onclick="openApp('${a.n}')"><div class="app-icon" style="background:${a.c}">${a.i}</div><span>${a.n}</span></div>`;
                (i < 8 ? p1 : p2).innerHTML += html;
            });
        }

        function openApp(name) {
            document.getElementById('control-center').style.top = '-100%';
            const a = apps.find(x => x.n === name) || {n:name, u:'default'};
            document.getElementById('win-t').innerText = a.n;
            const b = document.getElementById('win-b');
            document.getElementById('win').style.display = 'flex';
            b.innerHTML = "";

            if(name === 'Ayarlar') {
                b.innerHTML = `<div style="padding:20px">
                    <h2>Nova OS ${isV17 ? 'V17' : 'V16'}</h2><hr>
                    <p>Cihaz: MSI Katana Special (32GB RAM)</p>
                    <div onclick="updateOS()" style="padding:15px; background:#eee; border-radius:12px; margin-bottom:10px; cursor:pointer">Cihaz Güncelleme ${isV17 ? '(Güncel)' : '(V17 Mevcut!)'}</div>
                    <div onclick="location.reload()" style="padding:15px; background:#ffebeb; color:red; border-radius:12px; cursor:pointer">Cihazı Sıfırla</div>
                </div>`;
            } else if(name === 'Telefon') {
                b.innerHTML = `<div style="padding:40px; text-align:center;"><input type="text" id="num" style="width:100%; font-size:30px; text-align:center;" placeholder="Numara..."><button onclick="window.location.href='tel:'+document.getElementById('num').value" style="width:100%; height:60px; background:#2ecc71; color:white; border:none; border-radius:30px; margin-top:20px; font-weight:bold;">ARA</button></div>`;
            } else if(name === 'NurıWEB') {
                b.innerHTML = `<iframe src="https://www.bing.com"></iframe>`;
            } else if(a.u === 'camera') {
                b.innerHTML = `<video id="vid" autoplay style="width:100%; height:100%; object-fit:cover"></video>`;
                navigator.mediaDevices.getUserMedia({video:true}).then(s => document.getElementById('vid').srcObject = s);
            } else {
                b.innerHTML = `<iframe src="${a.u}"></iframe>`;
            }
        }

        function updateOS() {
            if(isV17) return alert("Sistem zaten V17!");
            if(confirm("V17 Güncellemesi yüklensin mi? (Denetim Masası ve Yeni Uygulamalar içerir)")) {
                isV17 = true;
                closeWin();
                document.getElementById('boot').style.display = 'flex';
                document.getElementById('boot-fill').style.width = '0%';
                setTimeout(() => {
                    document.getElementById('boot-fill').style.width = '100%';
                    setTimeout(() => {
                        document.getElementById('boot').style.display = 'none';
                        renderApps();
                        alert("Nova OS V17 Kuruldu! Denetim masasını açmak için saat kısmına bas.");
                    }, 2100);
                }, 100);
            }
        }

        function closeWin() {
            const v = document.getElementById('vid');
            if(v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('win').style.display = 'none';
        }

        setInterval(() => {
            const d = new Date();
            const time = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
            document.getElementById('lock-time').innerText = time;
            document.getElementById('os-clock').innerText = time;
        }, 1000);
    </script>
</body>
</html>
